name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate method cards
        run: python3 scripts/validate_catalog.py
      - name: Check wrappers compile
        run: python3 -m compileall -q skills
      - name: Smoke-test the query tool
        run: python3 skills/stats-method-picker/query.py --categories
